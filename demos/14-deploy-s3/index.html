<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_TITLE}}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1ea;
      color: #1c1917;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: min(36rem, calc(100% - 2rem));
      background: #fff;
      border: 1px solid #d6d3d1;
      border-radius: 12px;
      padding: 2rem 2.2rem;
      box-shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
    }
    p { line-height: 1.5; }
    .ok { color: #0f766e; font-weight: 700; }
    .meta {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e7e5e4;
      font-size: 0.95rem;
      color: #57534e;
    }
  </style>
</head>
<body>
  <main>
    <p class="ok">Deployed to Amazon S3</p>
    <h1>{{SITE_TITLE}}</h1>
    <p>This page was uploaded by a Jenkins <strong>Deploy</strong> stage using
       <code>aws s3 cp</code>. The bucket name came from <strong>Build with Parameters</strong>.</p>
    <div class="meta">
      <div>Bucket: {{S3_BUCKET}}</div>
      <div>Build number: {{BUILD_NUMBER}}</div>
      <div>Job: {{JOB_NAME}}</div>
      <div>Generated: {{GENERATED_AT}}</div>
    </div>
  </main>
</body>
</html>
